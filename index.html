
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlanSee Sales Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
      color: #f5a623;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .tagline {
      font-size: 18px;
      color: #fff;
      margin-bottom: 30px;
    }
    .counter {
      font-size: 72px;
      font-weight: bold;
      margin: 20px 0;
    }
    .progress-bar {
      width: 80%;
      height: 40px;
      background-color: #333;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress {
      height: 100%;
      background-color: #f5a623;
      width: 0;
      transition: width 1s ease-in-out;
    }
    .target-label {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 20px;
    }
    .milestone {
      font-size: 24px;
      color: #fff;
      margin-top: 10px;
    }
    .top-seller {
      margin-top: 30px;
      font-size: 20px;
      color: #f5a623;
    }
  </style>
</head>
<body>
  <div class="logo">plan<span style="color:white">See</span></div>
  <div class="tagline">Get what you see</div>
  <div class="counter" id="counter">0 m²</div>
  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>
  <div class="target-label">Target: 4500 m²</div>
  <div class="milestone" id="milestone">Let's break the 1st 1000m²!</div>
  <div class="top-seller" id="topSeller">Top Seller: ...</div>

  <audio id="celebrateSound" src="https://actions.google.com/sounds/v1/crowds/crowd_cheer.ogg"></audio>

  <script>
    const TARGET = 4500;

    async function fetchData() {
      const url = 'https://opensheet.elk.sh/1EKKNz639aylsX8mDBzBG00k2Dq9B_TeidN6dXyGjtYg/Sheet1';
      try {
        const res = await fetch(url);
        const data = await res.json();
        let total = 0;
        const memberTotals = {};

        data.forEach(row => {
          const meters = parseFloat(row.meter);
          const member = row.member;
          if (!isNaN(meters)) {
            total += meters;
            if (member) {
              memberTotals[member] = (memberTotals[member] || 0) + meters;
            }
          }
        });

        document.getElementById('counter').textContent = `${total} m²`;
        const percentage = Math.min((total / TARGET) * 100, 100);
        document.getElementById('progress').style.width = `${percentage}%`;

        const milestone = document.getElementById('milestone');
        const sound = document.getElementById('celebrateSound');

        if (total >= 3000) {
          milestone.textContent = '🎉 Goal Achieved! Incredible work team!';
          sound.play();
        } else if (total >= 2000) {
          milestone.textContent = '🔥 Final push! Just a little more!';
        } else if (total >= 1000) {
          milestone.textContent = '💪 Halfway there! Keep going!';
        } else {
          milestone.textContent = "Let's break the 1st 1000m²!";
        }

        const topMember = Object.entries(memberTotals).sort((a, b) => b[1] - a[1])[0];
        document.getElementById('topSeller').textContent = topMember ? `Top Seller: ${topMember[0]}` : 'Top Seller: N/A';
      } catch (error) {
        console.error('Error fetching data:', error);
      }
    }

    fetchData();
    setInterval(fetchData, 60000);
  </script>
</body>
</html>
