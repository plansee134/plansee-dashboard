<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PlanSee Sales & Ops Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
      color: #f5a623;
      text-align: center;
      padding: 20px 0;
    }
    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .logo span { color: #fff; }
    .tagline {
      font-size: 18px;
      color: #fff;
      margin-bottom: 30px;
    }

    .teams-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .team-container {
      flex: 1 1 300px;
      max-width: 500px;
      background: #111;
      border-radius: 8px;
      padding: 20px;
    }

    .team-container h2 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    .counter {
      font-size: 56px;
      font-weight: bold;
      margin: 10px 0;
    }

    .progress-bar {
      width: 100%;
      height: 30px;
      background: #333;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress {
      height: 100%;
      width: 0;
      transition: width 1s ease-in-out;
    }

    .target-label {
      font-size: 14px;
      margin-bottom: 15px;
    }

    .milestone {
      font-size: 20px;
      color: #fff;
      margin-bottom: 10px;
    }

    .top-seller {
      font-size: 18px;
    }

    /* Sales - Orange */
    #salesTeam h2,
    #salesTeam .counter,
    #salesTeam .target-label,
    #salesTeam .top-seller {
      color: #f5a623;
    }
    #salesTeam .progress {
      background-color: #f5a623;
    }

    /* Ops - Green */
    #opsTeam h2,
    #opsTeam .counter,
    #opsTeam .target-label,
    #opsTeam .top-seller {
      color: #4CAF50;
    }
    #opsTeam .progress {
      background-color: #4CAF50;
    }

    /* Design - Blue */
    #designTeam h2,
    #designTeam .counter,
    #designTeam .target-label,
    #designTeam .top-seller {
      color: #00BCD4;
    }
    #designTeam .progress {
      background-color: #00BCD4;
    }
  </style>
</head>
<body>
  <div class="logo">Plan<span>See</span></div>
  <div class="tagline">Get what you see</div>

  <div class="teams-wrapper">
    <!-- Sales Team Card -->
    <div class="team-container" id="salesTeam">
      <h2>Sales Team</h2>
      <div class="counter" id="salesCounter">0 m²</div>
      <div class="progress-bar"><div class="progress" id="salesProgress"></div></div>
      <div class="target-label" id="salesTargetLabel">Target: 0 m²</div>
      <div class="milestone" id="salesMilestone">Let's break the 1st 25%!</div>
      <div class="top-seller" id="topSeller">Top Seller: N/A</div>
    </div>

    <!-- Design Team Card (Now in the middle) -->
    <div class="team-container" id="designTeam">
      <h2>Design Team</h2>
      <div class="counter" id="designCounter">0 m²</div>
      <div class="progress-bar"><div class="progress" id="designProgress"></div></div>
      <div class="target-label" id="designTargetLabel">Target: 0 m²</div>
      <div class="milestone" id="designMilestone">Let's break the 1st 25%!</div>
      <div class="top-seller" id="topDesigners">Top Achievers: N/A</div>
    </div>

    <!-- Operation Team Card (Now last) -->
    <div class="team-container" id="opsTeam">
      <h2>Operation Team</h2>
      <div class="counter" id="opsCounter">0 m²</div>
      <div class="progress-bar"><div class="progress" id="opsProgress"></div></div>
      <div class="target-label" id="opsTargetLabel">Target: 0 m²</div>
      <div class="milestone" id="opsMilestone">Let's break the 1st 25%!</div>
      <div class="top-seller" id="topAchiever">Top Achiever: N/A</div>
    </div>
  </div>

  <audio id="celebrateSound" src="https://actions.google.com/sounds/v1/crowds/crowd_cheer.ogg"></audio>

  <script>
    const SHEET_ID = '1EKKNz639aylsX8mDBzBG00k2Dq9B_TeidN6dXyGjtYg';
    const URL = `https://opensheet.elk.sh/${SHEET_ID}/Sheet1`;

    async function fetchData() {
      try {
        const res = await fetch(URL);
        const data = await res.json();

        const first = data[0];
        const salesTarget = parseFloat(first.sales_target) || 0;
        const opsTarget = parseFloat(first.ops_target) || 0;

        let salesTotal = 0, opsTotal = 0;
        const salesBy = {}, opsBy = {};

        data.forEach(row => {
          const sM = parseFloat(row.sales_meter) || 0;
          const oM = parseFloat(row.ops_meter) || 0;
          salesTotal += sM;
          opsTotal += oM;

          if (row.sales_member)
            salesBy[row.sales_member] = (salesBy[row.sales_member] || 0) + sM;
          if (row.ops_member)
            opsBy[row.ops_member] = (opsBy[row.ops_member] || 0) + oM;
        });

        updateTeam('sales', salesTotal, salesTarget, salesBy);
        updateTeam('ops', opsTotal, opsTarget, opsBy, true);
        updateDesignTeam(data);

      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    function updateTeam(prefix, total, target, byMember, isOps = false) {
      const cnt = document.getElementById(`${prefix}Counter`);
      const prog = document.getElementById(`${prefix}Progress`);
      const lbl = document.getElementById(`${prefix}TargetLabel`);
      const mile = document.getElementById(`${prefix}Milestone`);
      const topEl = document.getElementById(isOps ? 'topAchiever' : 'topSeller');
      const sound = document.getElementById('celebrateSound');

      cnt.textContent = `${total} m²`;
      const pct = target > 0 ? Math.min((total / target) * 100, 100) : 0;
      prog.style.width = `${pct}%`;
      lbl.textContent = `Target: ${target} m²`;

      if (total >= target) {
        mile.textContent = '🎉 Goal Achieved!';
        sound.play();
      } else if (total >= target * 0.75) {
        mile.textContent = '🔥 Almost there!';
      } else if (total >= target * 0.5) {
        mile.textContent = '💪 Halfway!';
      } else {
        mile.textContent = `Let's break the 1st ${Math.floor(target * 0.25)} m²!`;
      }

      const top = Object.entries(byMember).sort((a, b) => b[1] - a[1])[0];
      if (top) {
        const label = isOps ? 'Top Achiever' : 'Top Seller';
        topEl.textContent = `${label}: ${top[0]}`;
      }
    }

    function updateDesignTeam(data) {
      let totalTarget = 0, totalMeter = 0;
      const memberMap = {};

      data.forEach(row => {
        const dT = parseFloat(row.design_target) || 0;
        const tT = parseFloat(row.technical_target) || 0;
        const dM = parseFloat(row.design_meter) || 0;
        const tM = parseFloat(row.technical_meter) || 0;
        const member1 = row.design_member;
        const member2 = row.technical_member;

        totalTarget += (dT + tT) / 2;
        totalMeter += (dM + tM) / 2;

        if (member1) memberMap[member1] = (memberMap[member1] || 0) + dM;
        if (member2) memberMap[member2] = (memberMap[member2] || 0) + tM;
      });

      const cnt = document.getElementById("designCounter");
      const prog = document.getElementById("designProgress");
      const lbl = document.getElementById("designTargetLabel");
      const mile = document.getElementById("designMilestone");
      const topEl = document.getElementById("topDesigners");
      const sound = document.getElementById('celebrateSound');

      cnt.textContent = `${Math.round(totalMeter)} m²`;

      const pct = totalTarget > 0 ? Math.min((totalMeter / totalTarget) * 100, 100) : 0;
      prog.style.width = `${pct}%`;
      lbl.textContent = `Target: ${Math.round(totalTarget)} m²`;

      if (totalMeter >= totalTarget) {
        mile.textContent = '🎉 Goal Achieved!';
        sound.play();
      } else if (totalMeter >= totalTarget * 0.75) {
        mile.textContent = '🔥 Almost there!';
      } else if (totalMeter >= totalTarget * 0.5) {
        mile.textContent = '💪 Halfway!';
      } else {
        mile.textContent = `Let's break the 1st ${Math.floor(totalTarget * 0.25)} m²!`;
      }

      const topSorted = Object.entries(memberMap).sort((a, b) => b[1] - a[1]).slice(0, 2);
      if (topSorted.length) {
        topEl.innerHTML = `Top Achievers:<br>${topSorted.map(x => x[0]).join('<br>')}`;
      }
    }

    fetchData();
    setInterval(fetchData, 60000);
  </script>
</body>
</html>
